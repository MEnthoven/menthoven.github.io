<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="images/icon_cropped.jpg">
    <title>Maarten Enthoven</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .social-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #333;
            color: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .social-button:hover {
            transform: scale(1.1);
            background-color: #555;
        }

        h1 {
            color: #333;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">        
        <div class="social-links">
            <a href="https://www.linkedin.com/in/enthovenm/" class="social-button" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/MEnthoven" class="social-button" title="GitHub">
                <i class="fab fa-github"></i>
            </a>

            <a href="https://aiguille.ai" class="social-button" title="Personal Website">
                <i class="fas fa-mountain"></i>
            </a>

            <a href="https://www.strava.com/athletes/24721237" class="social-button" title="Strava">
                <i class="fab fa-strava"></i>
            </a>

            <a href="https://www.instagram.com/maartenenthoven/" class="social-button" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</body>
</html>
